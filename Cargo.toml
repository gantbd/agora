[workspace]
resolver = "3"
members = [
    "engine/agora-engine",
    "protocol/agora-protocol",
    "protocol/agora-wire",
    "client/agora-client",
    "service/agora-service",
    "service/agora-durable",
    "host/agora-host",
    "ports/agora-search-port",
    "ports/agora-delivery-projection-port",
    "ports/agora-interaction-port",
    "ports/agora-scheduled-publication-port",
    "ports/agora-storage-observation",
    "adapters/agora-aegis-verifier",
    "adapters/agora-search-memory",
    "adapters/agora-storage-directory",
    "transport/agora-local-transport",
    "applications/agora-local-daemon",
    "sdk/embedded",
    "sdk/client",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
