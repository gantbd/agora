[package]
name = "agora-local-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Public local Unix client for Agora composition profiles"
publish = false

[dependencies]
agora-actor-publication-port = { path = "../../ports/agora-actor-publication-port", version = "=0.1.0" }
agora-client = { path = "../agora-client", version = "=0.1.0" }
agora-delivery-projection-port = { path = "../../ports/agora-delivery-projection-port", version = "=0.1.0" }
agora-protocol = { path = "../../protocol/agora-protocol", version = "=0.1.0" }
agora-scheduled-publication-port = { path = "../../ports/agora-scheduled-publication-port", version = "=0.1.0" }
agora-wire = { path = "../../protocol/agora-wire", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
