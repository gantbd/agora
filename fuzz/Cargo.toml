[package]
name = "agora-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
agora-engine = { path = "../engine/agora-engine", version = "=0.3.0" }
agora-host = { path = "../host/agora-host", version = "=0.1.0" }
agora-local-daemon = { path = "../applications/agora-local-daemon", version = "=0.1.0" }
agora-service = { path = "../service/agora-service", version = "=0.1.0" }
agora-wire = { path = "../protocol/agora-wire", version = "=0.1.0" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "wire_canonical"
path = "fuzz_targets/wire_canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_canonical"
path = "fuzz_targets/checkpoint_canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outer_frame_canonical"
path = "fuzz_targets/outer_frame_canonical.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 1
