[package]
name = "agora-storage-directory"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Exclusive private-directory checkpoint adapter for Agora"
publish = false

[dependencies]
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }

[dev-dependencies]
agora-durable = { path = "../agora-durable", version = "=0.1.0" }
agora-engine = { path = "../..", version = "=0.3.0" }
agora-host = { path = "../agora-host", version = "=0.1.0" }
agora-protocol = { path = "../agora-protocol", version = "=0.1.0" }
agora-service = { path = "../agora-service", version = "=0.1.0" }
agora-wire = { path = "../agora-wire", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
