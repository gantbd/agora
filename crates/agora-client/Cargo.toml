[package]
name = "agora-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Transport-neutral client interpretation for Agora"
publish = false

[dependencies]
agora-protocol = { path = "../agora-protocol", version = "=0.1.0" }

[dev-dependencies]
agora-engine = { path = "../..", version = "=0.3.0" }
agora-service = { path = "../agora-service", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
