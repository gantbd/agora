[package]
name = "agora-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Canonical bounded wire encoding for Agora protocol V1"
publish = false

[dependencies]
agora-protocol = { path = "../agora-protocol", version = "=0.1.0" }
keystone-codec = { path = "../../../keystone/crates/keystone-codec", version = "=0.0.1" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

