[package]
name = "agora-durable"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Receipt-gated durable Agora service owner"
publish = false

[dependencies]
agora-protocol = { path = "../agora-protocol", version = "=0.1.0" }
agora-service = { path = "../agora-service", version = "=0.1.0" }
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }

[dev-dependencies]
agora-engine = { path = "../..", version = "=0.3.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
