[package]
name = "agora-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Bounded serialized in-process service for Agora"
publish = false

[dependencies]
agora-engine = { path = "../..", version = "=0.3.0" }
agora-protocol = { path = "../agora-protocol", version = "=0.1.0" }
agora-search-port = { path = "../agora-search-port", version = "=0.1.0" }
agora-wire = { path = "../agora-wire", version = "=0.1.0" }

[dev-dependencies]
agora-search-memory = { path = "../agora-search-memory", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
