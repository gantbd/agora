[package]
name = "agora-durable"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Receipt-gated durable Agora service owner"
publish = false

[dependencies]
agora-delivery-projection-port = { path = "../../ports/agora-delivery-projection-port", version = "=0.1.0" }
agora-host = { path = "../../host/agora-host", version = "=0.1.0" }
agora-interaction-port = { path = "../../ports/agora-interaction-port", version = "=0.1.0" }
agora-protocol = { path = "../../protocol/agora-protocol", version = "=0.1.0" }
agora-scheduled-publication-port = { path = "../../ports/agora-scheduled-publication-port", version = "=0.1.0" }
agora-service = { path = "../agora-service", version = "=0.1.0" }
agora-storage-observation = { path = "../../ports/agora-storage-observation", version = "=0.1.0" }
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }

[dev-dependencies]
agora-engine = { path = "../../engine/agora-engine", version = "=0.3.0" }
agora-wire = { path = "../../protocol/agora-wire", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
