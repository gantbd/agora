[package]
name = "agora-export-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Qualified private local composition for durable Agora export custody"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
agora-engine = { path = "../../engine/agora-engine", version = "=0.3.0" }
agora-export-durable = { path = "../../service/agora-export-durable", version = "=0.1.0" }
agora-export-service = { path = "../../service/agora-export-service", version = "=0.1.0" }
agora-sha256 = { path = "../../adapters/agora-sha256", version = "=0.1.0" }
agora-storage-directory = { path = "../../adapters/agora-storage-directory", version = "=0.1.0" }

[dev-dependencies]
agora-export-custody-port = { path = "../../ports/agora-export-custody-port", version = "=0.1.0" }
agora-service = { path = "../../service/agora-service", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
