[package]
name = "agora-local-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Application composition for an Aegis-authorized Agora local host"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
agora-aegis-verifier = { path = "../../adapters/agora-aegis-verifier", version = "=0.1.0" }
agora-durable = { path = "../../service/agora-durable", version = "=0.1.0" }
agora-host = { path = "../../host/agora-host", version = "=0.1.0" }
agora-local-transport = { path = "../../transport/agora-local-transport", version = "=0.1.0" }
agora-wire = { path = "../../protocol/agora-wire", version = "=0.1.0" }
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }

[dev-dependencies]
agora-actor-publication-port = { path = "../../ports/agora-actor-publication-port", version = "=0.1.0" }
aegis-client = { path = "../../../aegis/crates/aegis-client", version = "=0.1.0" }
aegis-protocol = { path = "../../../aegis/crates/aegis-protocol", version = "=0.1.0" }
agora-engine = { path = "../../engine/agora-engine", version = "=0.3.0" }
agora-client = { path = "../../client/agora-client", version = "=0.1.0" }
agora-delivery-projection-port = { path = "../../ports/agora-delivery-projection-port", version = "=0.1.0" }
agora-local-client = { path = "../../client/agora-local-client", version = "=0.1.0" }
agora-protocol = { path = "../../protocol/agora-protocol", version = "=0.1.0" }
agora-scheduled-publication-port = { path = "../../ports/agora-scheduled-publication-port", version = "=0.1.0" }
agora-service = { path = "../../service/agora-service", version = "=0.1.0" }
agora-storage-directory = { path = "../../adapters/agora-storage-directory", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
