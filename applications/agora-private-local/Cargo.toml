[package]
name = "agora-private-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Standalone private-local Agora application composition"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aegis-client = { path = "../../../aegis/crates/aegis-client", version = "=0.1.0" }
aegis-local-client = { path = "../../../aegis/crates/aegis-local-client", version = "=0.1.0" }
aegis-protocol = { path = "../../../aegis/crates/aegis-protocol", version = "=0.1.0" }
agora-aegis-verifier = { path = "../../adapters/agora-aegis-verifier", version = "=0.1.0" }
agora-engine = { path = "../../engine/agora-engine", version = "=0.3.0" }
agora-host = { path = "../../host/agora-host", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
