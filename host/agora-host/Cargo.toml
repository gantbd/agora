[package]
name = "agora-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Authenticated transport-neutral host boundary for Agora"
publish = false

[dependencies]
agora-protocol = { path = "../../protocol/agora-protocol", version = "=0.1.0" }
agora-service = { path = "../../service/agora-service", version = "=0.1.0" }
agora-wire = { path = "../../protocol/agora-wire", version = "=0.1.0" }

[dev-dependencies]
agora-engine = { path = "../../engine/agora-engine", version = "=0.3.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

