[package]
name = "agora-sdk-embedded"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Zero-authority embedded SDK facade for Agora"
license = "MIT OR Apache-2.0"

[dependencies]
agora-delivery-projection-port = { path = "../../ports/agora-delivery-projection-port", version = "=0.1.0" }
agora-engine = { path = "../../engine/agora-engine", version = "=0.3.0" }
agora-federated-publication-port = { path = "../../ports/agora-federated-publication-port", version = "=0.1.0" }
agora-host = { path = "../../host/agora-host", version = "=0.1.0" }
agora-interaction-port = { path = "../../ports/agora-interaction-port", version = "=0.1.0" }
agora-scheduled-publication-port = { path = "../../ports/agora-scheduled-publication-port", version = "=0.1.0" }
agora-service = { path = "../../service/agora-service", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
